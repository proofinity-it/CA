<text x="115.0" y="120" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#1f2328">Nat.add_zero</text>
<text x="115.0" y="150" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6e7781">a binding in a namespace</text>
<text x="115.0" y="204" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328"><tspan fill="#6e7781">found by</tspan><tspan dx="6">its namespace</tspan></text>
<text x="115.0" y="228" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328"><tspan fill="#6e7781">survives</tspan><tspan dx="6">until renamed</tspan></text>
<rect x="300.0" y="64" width="300" height="104" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="2.4"/>
