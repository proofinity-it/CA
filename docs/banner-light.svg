<text x="1075.0" y="120" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#1f2328">fun n => rfl</text>
<text x="1075.0" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#0969da">decl CRBaL3yvth9g…</text>
<text x="1075.0" y="204" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328"><tspan fill="#6e7781">found by</tspan><tspan dx="6">asking the network</tspan></text>
<text x="1075.0" y="228" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328"><tspan fill="#6e7781">survives</tspan><tspan dx="6">renames only</tspan></text>
