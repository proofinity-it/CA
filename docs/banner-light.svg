<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-label="CA: one theorem, four objects. Its name is found by asking a namespace and survives until renamed; its statement is found by computing it from the proposition and survives renames, moves and re-proving; its Lean proof is found in a repository; its proof term is a cache found by asking the network for witnesses.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<text x="20.0" y="34" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#6e7781" letter-spacing="0.8">ONE THEOREM, FOUR OBJECTS — HOW EACH IS FOUND, AND WHAT IT SURVIVES</text>
<text x="1180.0" y="34" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="600" fill="#1f2328">CA</text>
<rect x="20.0" y="64" width="190" height="104" rx="10" fill="#f6f8fa" stroke="#afb8c4" stroke-width="1.4"/>
