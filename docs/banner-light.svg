<text x="925.0" y="107.0" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6e7781">elaborates to</text>
<text x="600.0" y="276" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#6e7781">cite the statement: anyone can compute it, and nothing a proof does can change it · proofs are interchangeable witnesses · terms are caches</text>
