<text x="450.0" y="120" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#1f2328">∀ n : Nat, n + 0 = n</text>
<text x="450.0" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#0969da">stmt ByKFv4nqHrcs…</text>
<text x="450.0" y="204" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328"><tspan fill="#6e7781">found by</tspan><tspan dx="6">computing it from the proposition</tspan></text>
<text x="450.0" y="228" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328"><tspan fill="#6e7781">survives</tspan><tspan dx="6">renames, moves, re-proving</tspan></text>
<rect x="690.0" y="64" width="190" height="104" rx="10" fill="#f6f8fa" stroke="#afb8c4" stroke-width="1.4"/>
<text x="785.0" y="88" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#6e7781" letter-spacing="0.8">LEAN PROOF</text>
<text x="785.0" y="120" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#1f2328">:= rfl</text>
<text x="785.0" y="150" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#6e7781">Init/Core.lean:747</text>
<text x="785.0" y="204" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328"><tspan fill="#6e7781">found by</tspan><tspan dx="6">the repository holding it</tspan></text>
<text x="785.0" y="228" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328"><tspan fill="#6e7781">survives</tspan><tspan dx="6">nothing beyond its text</tspan></text>
